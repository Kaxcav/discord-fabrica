[phases.setup]
nixPkgs = ["nodejs_22", "cargo", "rustc", "pkg-config", "openssl"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build", "cargo build --release --bin discord-fabrica && cp target/release/discord-fabrica /app/discord-fabrica"]

[start]
cmd = "/app/discord-fabrica"
