name: Build Windows (Tauri)

on:
  push:
    branches: [master, main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # Tauri desktop app — instalador + .exe portável (Windows nativo)
  # ----------------------------------------------------------------
  build-tauri:
    name: Tauri App (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Instalar Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            windows/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-tauri-${{ hashFiles('windows/src-tauri/Cargo.lock') }}
          restore-keys: windows-tauri-

      - name: Instalar dependências npm
        working-directory: windows
        run: npm install

      - name: Build Tauri
        working-directory: windows
        run: npx tauri build

      - name: Upload instalador MSI + EXE
        uses: actions/upload-artifact@v4
        with:
          name: discord-fabrica-tauri-${{ github.sha }}
          path: |
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/discord-fabrica-windows.exe
          if-no-files-found: warn
          retention-days: 90
