name: Build Windows EXE

on:
  push:
    branches: [master, main]
    paths:
      - 'windows/src-rust/**'
      - 'windows/Cargo.toml'
      - 'windows/Cargo.lock'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            windows/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload discord-fabrica.exe
        uses: actions/upload-artifact@v4
        with:
          name: discord-fabrica-windows
          path: |
            windows/target/release/discord-fabrica.exe
            windows/target/release/local-bridge.exe
          if-no-files-found: error
          retention-days: 30

  build-cross-linux:
    name: Cross-compile Linux → Windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + MinGW
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get install -y mingw-w64

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            windows/target
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cross-windows-${{ hashFiles('windows/Cargo.lock') }}

      - name: Build release (cross)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload EXEs (cross-compiled)
        uses: actions/upload-artifact@v4
        with:
          name: discord-fabrica-windows-cross
          path: |
            windows/target/x86_64-pc-windows-gnu/release/discord-fabrica.exe
            windows/target/x86_64-pc-windows-gnu/release/local-bridge.exe
          if-no-files-found: error
          retention-days: 30
